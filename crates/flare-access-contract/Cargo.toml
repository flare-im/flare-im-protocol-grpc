[package]
name = "flare-access-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
description = "Flare signed access, recovery, release and trust document contracts"
repository = "https://github.com/flare-im/flare-protocol-grpc"

[features]
test-support = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
# The differential fixture targets the URL normalisation used by the existing wire contract.
url = "=2.5.7"
